<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get The Ultimate Faceless Creator Starter Kit (100% FREE)</title>
  <meta name="description" content="Stop wasting hours searching for content. Get 100+ Aesthetic Background Videos & 50 Viral Hooks ready to use — free for a limited time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-active: #047857;
      --border: #e5e7eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9fafb;
      background-image:
        radial-gradient(42rem 30rem at 12% -6%, rgba(16, 185, 129, 0.10), transparent 60%),
        radial-gradient(40rem 28rem at 92% 4%, rgba(56, 189, 248, 0.10), transparent 60%),
        radial-gradient(36rem 26rem at 50% 108%, rgba(251, 191, 36, 0.09), transparent 60%),
        radial-gradient(rgba(17, 24, 39, 0.045) 1px, transparent 1px);
      background-size: auto, auto, auto, 22px 22px;
    }

    .card {
      width: 100%;
      max-width: 680px;
      margin: 16px;
      padding: 56px 28px 48px;
      background: rgba(255, 255, 255, 0.86);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      box-shadow: 0 24px 56px -24px rgba(17, 24, 39, 0.14);
      text-align: center;
    }

    /* Hero visual: fanned video thumbnails */
    .hero {
      position: relative;
      width: 250px;
      height: 128px;
      margin: 0 auto 36px;
    }
    .thumb {
      position: absolute;
      border-radius: 14px;
      border: 3px solid #ffffff;
      box-shadow: 0 14px 28px -10px rgba(17, 24, 39, 0.22);
      display: grid;
      place-items: center;
    }
    .thumb-1 {
      width: 116px; height: 74px; left: 0; top: 26px;
      background: linear-gradient(135deg, #a7f3d0, #34d399);
      transform: rotate(-10deg);
      animation: float 6s ease-in-out infinite;
    }
    .thumb-2 {
      width: 134px; height: 86px; left: 50%; top: 12px; z-index: 2;
      background: linear-gradient(135deg, #bae6fd, #38bdf8);
      transform: translateX(-50%);
      box-shadow: 0 20px 36px -12px rgba(2, 132, 199, 0.35);
      animation: float 6s ease-in-out 1.2s infinite;
    }
    .thumb-3 {
      width: 116px; height: 74px; right: 0; top: 26px;
      background: linear-gradient(135deg, #fde68a, #fbbf24);
      transform: rotate(10deg);
      animation: float 6s ease-in-out 2.4s infinite;
    }
    .play {
      width: 30px; height: 30px; border-radius: 999px;
      background: #ffffff;
      display: grid; place-items: center;
      box-shadow: 0 4px 10px -2px rgba(17, 24, 39, 0.25);
    }
    .play::after {
      content: "";
      margin-left: 3px;
      border-left: 9px solid #0f766e;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }
    .sparkle {
      position: absolute;
      border-radius: 999px;
      background: #34d399;
    }
    .sparkle-1 { width: 10px; height: 10px; left: 34px; top: 4px; opacity: .8; animation: float 5s ease-in-out .6s infinite; }
    .sparkle-2 { width: 8px; height: 8px; right: 44px; top: 0; background: #38bdf8; opacity: .8; animation: float 5s ease-in-out 1.8s infinite; }
    .sparkle-3 { width: 8px; height: 8px; right: 20px; bottom: 0; background: #fbbf24; opacity: .8; animation: float 5s ease-in-out 3s infinite; }
    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .thumb, .sparkle { animation: none; }
    }
    @media (max-width: 400px) {
      .hero { width: 220px; height: 112px; }
      .thumb-1, .thumb-3 { width: 102px; height: 64px; }
      .thumb-2 { width: 118px; height: 76px; }
    }

    h1 {
      font-size: clamp(1.9rem, 6vw, 3.125rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.12;
      color: var(--text-primary);
    }
    h1 .free {
      white-space: nowrap;
      color: var(--accent-hover);
    }
    .sub {
      margin: 20px auto 0;
      max-width: 34rem;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .sub strong { font-weight: 600; color: #374151; }
    .cta-wrap { margin-top: 36px; }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 32px;
      background: linear-gradient(180deg, #10b981, #059669);
      color: #ffffff;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 12px 24px -10px rgba(5, 150, 105, 0.55);
      transition: transform 140ms ease, box-shadow 180ms ease, filter 180ms ease;
    }
    .cta:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 16px 30px -10px rgba(5, 150, 105, 0.6);
    }
    .cta:active { transform: translateY(0) scale(0.985); filter: brightness(0.98); }
    .cta:focus-visible { outline: 3px solid rgba(16, 185, 129, 0.4); outline-offset: 3px; }
    @media (min-width: 640px) {
      .cta { width: auto; padding: 18px 56px; }
    }
    .urgency {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 999px;
      background: #f59e0b;
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5);
      animation: pulse 2.2s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }

    /* Unclosable in-page locker frame */
    .locker {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(249, 250, 251, 0.96);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      z-index: 50;
    }
    .locker.open { display: flex; }
    .locker-inner {
      width: 100%;
      max-width: 480px;
    }
    .locker-card {
      width: 100%;
      height: min(680px, 86vh);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 64px -16px rgba(17, 24, 39, 0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .locker-frame {
      flex: 1;
      width: 100%;
      border: 0;
    }
    .locker-fallback {
      margin-top: 12px;
      text-align: center;
      font-size: 0.8125rem;
    }
    .locker-fallback a { color: var(--text-muted); }
    .locker-fallback a:hover { color: var(--text-primary); }
  </style>
</head>
<body>

  <main class="card">
    <div class="hero" aria-hidden="true">
      <div class="thumb thumb-1"><div class="play"></div></div>
      <div class="thumb thumb-2"><div class="play"></div></div>
      <div class="thumb thumb-3"><div class="play"></div></div>
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>
    </div>
    <h1>Get The Ultimate Faceless Creator Starter Kit <span class="free">(100% FREE)</span></h1>
    <p class="sub">
      Stop wasting hours searching for content. Get
      <strong>100+ Aesthetic Background Videos</strong> &amp;
      <strong>50 Viral Hooks</strong> ready to use.
    </p>
    <div class="cta-wrap">
      <a class="cta" id="cta" href="https://apptrk.net/cl/i/42dpo4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v11m0 0 4.2-4.2M12 14l-4.2-4.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 19.5h15" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        Download The Kit Now
      </a>
      <p class="urgency"><span class="dot" aria-hidden="true"></span>Available for free for a limited time.</p>
    </div>
  </main>

  <!-- Unclosable in-page locker frame (opens on CTA click) -->
  <div class="locker" id="locker" role="dialog" aria-modal="true" aria-label="Unlock your free kit">
    <div class="locker-inner">
      <div class="locker-card">
        <iframe class="locker-frame" id="lockerFrame" title="Unlock your free kit"></iframe>
      </div>
      <p class="locker-fallback">
        Page not loading? <a id="fallbackLink" href="https://apptrk.net/cl/i/42dpo4" target="_blank" rel="noopener noreferrer">Open it in a new tab</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      var LOCKER_URL = "https://apptrk.net/cl/i/42dpo4";
      var cta = document.getElementById("cta");
      var locker = document.getElementById("locker");
      var frame = document.getElementById("lockerFrame");

      // Opens the locker inside the page. Intentionally unclosable:
      // no close button, no backdrop dismiss, no Escape key.
      cta.addEventListener("click", function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // keep Ctrl/Cmd+click for new tab
        e.preventDefault();
        frame.src = LOCKER_URL;
        locker.classList.add("open");
        document.body.style.overflow = "hidden";
      });
    })();
  </script>

</body>
</html>
